name: Update Charging Rates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-charging-rates.yml
      - scripts/parse_rates.py
      - scripts/parse_operator_fees.py
      - data/operator_codes.json
      - tests/**
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-charging-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd

      - name: Test parsers
        run: |
          python -m unittest discover -s tests -v

      - name: Download roaming fee matrices
        run: |
          mkdir -p rates
          for stage in s1 s2 s3 s4 s5; do
            curl --fail --location --silent --show-error \
              --retry 3 --connect-timeout 10 --max-time 60 \
              --data "excelDown=Y&stage=${stage}" \
              --output "rates/${stage}.xlsx" \
              "https://ev.or.kr/nportal/evcarInfo/selectEvRoamFeeExcel.do"
          done

      - name: Download operator member and non-member prices
        run: |
          mkdir -p operator-fees
          for kind in M:member N:non_member; do
            curl --fail --location --silent --show-error \
              --retry 3 --connect-timeout 10 --max-time 60 \
              --data "excelDown=Y&feeGb=${kind%%:*}&speeds=s1,s2,s3,s4,s5" \
              --output "operator-fees/${kind#*:}.xlsx" \
              "https://ev.or.kr/nportal/evcarInfo/selectEvBusiFeeExcel.do"
          done
          # Remarks and time-of-use / regional variants. Optional: the parser
          # skips the notes if this download or its layout breaks.
          curl --fail --location --silent --show-error \
            --retry 3 --connect-timeout 10 --max-time 60 \
            --output operator-fees/variants.xls \
            "https://ev.or.kr/nportal/evcarInfo/selectEvcarStationPriceExcel.do" \
            || rm -f operator-fees/variants.xls

      - name: Parse and generate JSON
        run: |
          python scripts/parse_rates.py rates charging_rates.json
          python -m scripts.parse_operator_fees operator-fees operator_rates.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charging_rates.json operator_rates.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update charging rates ($(date +'%Y-%m-%d'))"
          git push
